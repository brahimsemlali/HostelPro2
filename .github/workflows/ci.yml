name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    env:
      # Placeholder envs — CI never talks to real services; build only needs them to exist
      NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
      SUPABASE_SERVICE_ROLE_KEY: placeholder-service-key
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      LEMONSQUEEZY_API_KEY: placeholder
      LEMONSQUEEZY_STORE_ID: "370406"
      LEMONSQUEEZY_WEBHOOK_SECRET: placeholder
      LEMONSQUEEZY_STARTER_VARIANT_ID: "1633090"
      LEMONSQUEEZY_PRO_VARIANT_ID: "1633110"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Unit tests (billing money paths)
        run: npm test

      - name: Build
        run: npm run build
